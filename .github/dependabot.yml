version: 2

updates:
  # Keep npm dependencies moving so they never rot into security advisories.
  # Minor and patch bumps are grouped into a single PR to keep the noise down;
  # majors arrive as individual PRs because they need a human look.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # React stays on 18 deliberately (see CLAUDE.md). Dependabot also splits
      # react and react-dom into separate PRs, and merging one without the other
      # breaks the app, so majors here are opt-in and done by hand.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      # TypeScript 7 falls outside the typescript-eslint peer range
      # (>=4.8.4 <6.1.0), so it fails lint. Revisit when that plugin supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
